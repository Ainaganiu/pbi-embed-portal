<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Sign In</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1 id="auth-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="11" width="18" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="1.8"/>
        </svg>
        <span id="auth-title-text">Sign in</span>
      </h1>
      <p class="auth-subtitle" id="auth-subtitle">Sign in to manage this portal.</p>

      <div id="form-message" class="form-message" hidden></div>

      <form id="auth-form">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <div class="hint" id="password-hint" hidden>At least 8 characters.</div>
        </div>
        <button type="submit" class="btn-primary" id="submit-btn">Sign in</button>
      </form>
    </div>
  </div>

  <script src="/login.js"></script>
</body>
</html>
