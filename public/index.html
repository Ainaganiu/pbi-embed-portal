<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Power BI Embedded Portal</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/powerbi-client@2.23.1/dist/powerbi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="/charts.js"></script>
</head>
<body>
  <header id="app-header">
    <div id="brand">
      <span id="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="12" width="4" height="9" rx="1" fill="currentColor" opacity="0.55"/>
          <rect x="10" y="7" width="4" height="14" rx="1" fill="currentColor" opacity="0.8"/>
          <rect x="17" y="3" width="4" height="18" rx="1" fill="currentColor"/>
        </svg>
      </span>
      <span id="brand-name">Reports Portal</span>
    </div>

    <div id="report-select-wrap">
      <select id="report-picker" aria-label="Select report"></select>
      <svg id="report-select-caret" width="10" height="6" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <button id="chat-toggle" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 4h16v11H7l-3 3V4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
      <span>Ask AI</span>
    </button>

    <a href="/admin.html" id="admin-link" title="Admin settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" stroke="currentColor" stroke-width="1.6"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" stroke-width="1.3"/>
      </svg>
    </a>
  </header>

  <main id="app-main">
    <div id="report-container">
      <div id="report-empty-state" class="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="12" width="4" height="9" rx="1" fill="currentColor" opacity="0.4"/>
          <rect x="10" y="7" width="4" height="14" rx="1" fill="currentColor" opacity="0.65"/>
          <rect x="17" y="3" width="4" height="18" rx="1" fill="currentColor" opacity="0.9"/>
        </svg>
        <p>Loading report…</p>
      </div>
    </div>

    <div id="chat-resize-handle" hidden></div>

    <aside id="chat-panel" hidden>
      <div id="chat-panel-header">
        <div id="chat-panel-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2a5 5 0 0 0-5 5v2a5 5 0 0 0 10 0V7a5 5 0 0 0-5-5z" stroke="currentColor" stroke-width="1.6"/>
            <path d="M5 13a7 7 0 0 0 14 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M12 20v2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <span>Ask about this data</span>
        </div>
        <button id="chat-close" aria-label="Close chat">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div id="chat-log">
        <div id="chat-empty-state" class="empty-state">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2a5 5 0 0 0-5 5v2a5 5 0 0 0 10 0V7a5 5 0 0 0-5-5z" stroke="currentColor" stroke-width="1.4" opacity="0.55"/>
            <path d="M5 13a7 7 0 0 0 14 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
          </svg>
          <p>Ask about what's on screen, or about the underlying data.</p>
          <div id="chat-suggestions">
            <button type="button" class="suggestion" data-q="What is this page telling me?">What is this page telling me?</button>
            <button type="button" class="suggestion" data-q="What stands out on this page?">What stands out?</button>
            <button type="button" class="suggestion" data-q="Any risks or outliers I should look at on this page?">Any risks or outliers?</button>
            <button type="button" class="suggestion" data-q="Summarise the current view for an exec">Summarise for an exec</button>
          </div>
        </div>
      </div>

      <form id="chat-form">
        <input id="chat-input" type="text" placeholder="Ask a question…" autocomplete="off" />
        <button type="submit" id="chat-send" aria-label="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 11l17-8-8 17-2-7-7-2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>
    </aside>
  </main>

  <div id="chart-modal" hidden>
    <div id="chart-modal-backdrop"></div>
    <div id="chart-modal-panel" role="dialog" aria-modal="true" aria-labelledby="chart-modal-title">
      <div id="chart-modal-header">
        <span id="chart-modal-title">Chart</span>
        <button id="chart-modal-close" aria-label="Close chart">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div id="chart-modal-body"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
