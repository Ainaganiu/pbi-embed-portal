databases:
  - name: pbi-embed-portal-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: pbi-embed-portal
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/reports
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: pbi-embed-portal-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SETTINGS_ENCRYPTION_KEY
        generateValue: true
